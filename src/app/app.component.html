<!-- First Navbar -->
<nav class="navbar navbar-expand-lg bg-secondary-subtle col-12 col-md-12">
    <div class="container-fluid text-black d-flex aling-items-centre justify-content-between" id="">
        <ul class="navbar-nav text-black">
            <li class="nav-item text-black">
                <a class="nav-link" href="tel:1800 26666">
                    <span class="call-us text-body-emphasis">
                        <img [src]="callUsImg">
                        1800 26666
                    </span>
                    <small class="text-body-emphasis">
                        (Available 24 x 7)
                    </small>
                </a>
            </li>
        </ul>
        <div class="collapse navbar-collapse mt-2">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a href="#" class="nav-link text-body-emphasis">
                        | &nbsp; <img [src]="callBackImg">
                        Call Back
                    </a>
                </li>
                <li class="nav-item">
                    <a href="" class="nav-link text-body-emphasis">
                        | &nbsp;
                        <button class="btn btn-sm bg-white text-body-emphasis rounded-pill" id="btnn">
                            <span class="dotsgreen">
                            </span>
                            Live Chat
                        </button>
                    </a>
                </li>
            </ul>
        </div>
        <div class="collapse navbar-collapse ms-lg-4 dropdown">
            <ul class="navbar-nav ms-lg-5 ">
                <li class="nav-item" *ngFor="let items of topMenuList" [ngClass]="{'blue':items.isSelected}">
                    <a href="" class="nav-link">
                        {{items.Title}}
                        <i class="fa-solid fa-angle-down"></i>
                    </a>
                    <ul class="dropdown-menu">
                        <li *ngFor="let subitem of items.SubMenueList">
                            <a class="dropdown-item" href="#">{{subitem}}</a>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
        <!-- Modal Structure -->
        <div class="modal fade" id="login-modal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">

                    <!-- Modal Header -->
                    <div class="modal-header d-flex justify-content-between">
                        <div>
                            <h3 class="mb-4">Login</h3>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <!-- Modal Body -->
                    <div class="modal-body">
                        <form [formGroup]="loginForm" (ngSubmit)="login()">

                            <!-- Mobile Number Input -->
                            <div class="mb-3">
                                <label for="otpMobile" class="form-label">Mobile no.</label>
                                <input type="tel" id="otpMobile" formControlName="mobileNo" maxlength="10"
                                    minlength="10" class="form-control" placeholder="Enter 10-digit number" required />
                            </div>

                            <!-- Send OTP Button -->
                            <button type="submit" class="btn orange col-12 mt-3">Login</button>

                        </form>

                        <!-- Create Account Link -->
                        <div class="text-center mt-4">
                            <p>
                                New to ICICI Lombard?
                                <a routerLink="login" class="il-link">Create an account</a>
                            </p>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- Trigger Button to Open Modal -->
        <button class="btn btn-sm orange ms-3 mt-2 mb-2" data-bs-toggle="modal" data-bs-target="#login-modal">
            Login&nbsp;
            <i class="fa-solid fa-chevron-right"></i>
        </button>
    </div>
</nav>

<!-- Second Nav-Bar -->
<nav class="navbar navbar-expand-lg sec-nav-color col-12">
    <div class="container-fluid">
        <button class="navbar-toggler" (dblclick)="dblclick()" (click)="click()" data-bs-toggle="collapse"
            data-bs-target="#sec-nav-coll">
            <span class="navbar-toggler-icon icon-light"></span>
        </button>
        <div class="nav-brand">
            <img [src]="iciLogo">
        </div>
        <div class="collapse navbar-collapse" id="sec-nav-coll" *ngIf="isShow">
            <ul class="navbar-nav">
                <li class="nav-item" *ngFor="let menue of secondNavMenueList">
                    <a href="" class="nav-link nav-linkk">
                        {{menue.Title}}
                        <i class="fa-solid fa-angle-down"></i>
                    </a>
                    <div class="sub-menu-wrap d-flex sub-menue">
                        <div class="sub-menu-img">
                            <img class="mt-5 ms-4" [src]="menue.Img">
                        </div>
                        <div class="sub-menu-list">
                            <ul>
                                <li *ngFor="let subMenue of menue.SubMenueList">
                                    <a class="dropdown-item mb-3" routerLink="menue.Link">{{subMenue}}</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</nav>
