<div class="modal-overlay">
  <div class="modal-left-panel">
    <!-- close button -->
    <button type="button" class="btn-close position-absolute m-3" aria-label="Close" (click)="close.emit()"></button>

    <h2 class="heading">Geographical Locations</h2>

    <div class="geo-cards">
      <div class="geo-card" *ngFor="let item of geoData">
        <div class="geo-img"><img [src]="item.img" class="geo-icon" alt="{{ item.title }}"></div>
        <div class="geo-info">
          <div class="geo-title">{{ item.title }}</div>
          <div class="geo-description">{{ item.description }}</div>
        </div>
      </div>
    </div>

    <div class="accordion">
      <div class="accordion-item" *ngFor="let section of countrySections; let i = index">
        <div class="accordion-header" (click)="toggleSection(i)">
          {{ section.title }}
          <i class="bi bi-chevron-compact-down arrow"  [class.rotated]="section.expanded">v</i>
        </div>
        <div class="accordion-body" *ngIf="section.expanded">
          <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 g-1">
            <div *ngFor="let country of section.countries">
                   <div class="country-box py-2 px-2 text-center ">
                         {{ country }}
                     </div>
             </div>
          </div>
        </div>
      </div>
    </div>



  </div>
</div>
