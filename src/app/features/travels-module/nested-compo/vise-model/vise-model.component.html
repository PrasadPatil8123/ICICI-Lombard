<div class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <span>Attention!</span>
      <button class="close-btn" (click)="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <p>{{ message }}</p>
    </div>
    <div class="modal-footer">
      <button class="ok-btn" (click)="closeModal()">Ok</button>
    </div>
  </div>
</div>
